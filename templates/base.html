<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Soul's Treat — Fresh Donuts Delivered{% endblock %}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,600&family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

  <!-- NAVBAR -->
  <header class="nav">
    <div class="nav-inner">
      <a href="/" class="logo">
        <span class="logo-script">Soul's</span>
        <span class="logo-sub">Treat</span>
      </a>
      <nav>
        <a href="/#boxes">Boxes</a>
        <a href="/#zones">Delivery</a>
        <a href="/order" class="btn">Order Now</a>
      </nav>
    </div>
  </header>

  <!-- PAGE CONTENT -->
  {% block content %}{% endblock %}

  <!-- FOOTER -->
  <footer class="footer">
    <div class="footer-inner">
      <div>
        <div class="logo footer-logo">
          <span class="logo-script">Soul's</span>
          <span class="logo-sub">Treat</span>
        </div>
        <p class="tagline">Made with love, just for you.</p>
      </div>
      <div>
        <h4>Order</h4>
        <p>📞 0748 405 018</p>
        <p>📞 0112 926 243</p>
      </div>
      <div>
        <h4>Follow</h4>
        <p>📷 @souls.treat_ke</p>
        <p>🎵 @souls.treat</p>
      </div>
    </div>
    <p class="copy">© 2025 Soul's Treat · Nairobi, Kenya</p>
  </footer>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script><link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/favicon.svg') }}">
</body>
</html>
